<!DOCTYPE html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mūsų projektas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <h1>Mūsų komandinis GitHub projektas</h1>
      <p class="subtitle">Šį projektą kuriame dviese ir mokomės dirbti su Git bei GitHub.</p>

      <section class="counter-section" aria-label="Paspaudimų skaitiklis">
        <h2>Paspaudimų skaitiklis</h2>
        <p id="counter" class="counter-value" aria-live="polite">0</p>
        <button type="button" id="count-button">Spausk mane</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
